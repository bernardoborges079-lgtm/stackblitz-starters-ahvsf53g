<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Turma.js" defer></script>
    <script src="Aluno.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="Main.js" defer></script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button class="tab-button active" id="btn-cadastrar-turma" onclick="cadastroTurma()">Cadastrar Turma</button>
      <button class="tab-button" id="btn-cadastrar-aluno" onclick="cadastroAluno()">Cadastrar Aluno</button>
      <button class="tab-button" id="btn-listar" onclick="listarAluno()">Listar Alunos</button>
    </div>

    <!-- Aba 1: Cadastrar Turma -->
    <div id="tab-cadastrar-turma" class="tab-content active">
      <label for="nomeCurso">Nome do Curso:</label>
      <input id="nomeCurso" type="text" placeholder= >

      <label for="professor">Nome do Professor:</label>
      <input id="professor" type="text" placeholder= >

      <button onclick="btnSalvarTurma()" class="btn-salvar">Salvar Turma</button>
    </div>

    <!-- Aba 2: Cadastrar Aluno -->
    <div id="tab-cadastrar-aluno" class="tab-content">
      <label for="select-turma">Selecione a Turma:</label>
      <select id="select-turma" onchange="Interface.validarPreenchimento()">
        <option value="">Selecione uma turma</option>
      </select>

      <label for="nome">Nome do Aluno:</label>
      <input id="nome" type="text" oninput="Interface.validarPreenchimento()" placeholder="Digite o nome do aluno" />

      <label for="disciplina">Selecione a Disciplina:</label>
      <select id="disciplina" onchange="Interface.carregarNotasDisciplina()">
        <option value="">Selecione uma disciplina</option>
        <option value="matematica">Matemática</option>
        <option value="portugues">Português</option>
        <option value="ciencia">Ciência</option>
        <option value="historia">História</option>
        <option value="geografia">Geografia</option>
      </select>

      <div class="notas-group">
        <div>Nota 1: <input id="n1" type="text" inputmode="decimal" oninput="Interface.registrarNotas()" disabled /></div>
        <div>Nota 2: <input id="n2" type="text" inputmode="decimal" oninput="Interface.registrarNotas()" disabled /></div>
        <div>Nota 3: <input id="n3" type="text" inputmode="decimal" oninput="Interface.registrarNotas()" disabled /></div>
      </div>

      <button id="btn-salvar-aluno" onclick="btnSalvar()" class="btn-salvar" disabled>Salvar Aluno</button>
    </div>

    <!-- Aba 3: Listar -->
    <div id="tab-listar" class="tab-content">
      <h3>Turmas e Alunos Cadastrados</h3>
      <div id="alunos" class="lista-alunos">
        <p>Nenhuma turma cadastrada ainda.</p>
      </div>
    </div>
  </body>
</html>
